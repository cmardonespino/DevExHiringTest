name: GitHub Actions - Carlos Mardones Pino
run-name: ${{ github.actor }} is running application build 🚀
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "590810503117"
  ECR_URI: "590810503117.dkr.ecr.us-east-1.amazonaws.com/devexhiringtest-cmardonesp"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - uses: ./.github/actions/ecr-login
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCES_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/build
        with:
          ecr-repo: ${{ env.ECR_URI }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - uses: ./.github/actions/ecr-login
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCES_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/unit-test
        with:
          ecr-repo: ${{ env.ECR_URI }}
          aws-region: ${{ env.AWS_REGION }}

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - uses: ./.github/actions/ecr-login
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCES_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/lint
        with:
          ecr-repo: ${{ env.ECR_URI }}
          aws-region: ${{ env.AWS_REGION }}

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - uses: ./.github/actions/ecr-login
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCES_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
