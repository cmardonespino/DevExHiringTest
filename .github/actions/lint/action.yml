name: "Code linting"
description: "Ejecuta un linter para verificar y corregir problemas de estilo y errores en el código, asegurando calidad y consistencia en el proyecto"
inputs:
  aws-region:
    description: "AWS Region where the ECR is located"
    required: true
  context:
    description: "Build context where the container will be built"
    required: false
    default: "."
  target:
    description: "The target stage to build"
    required: false
  dockerfile:
    description: "Dockerfile used to build container"
    required: true
    default: "Dockerfile"
  cache-tag:
    description: "Cache tag for reduce build time"
    default: build-${{ github.sha }}
  ecr-repo:
    description: "ECR repo where the container will be pushed"
    required: true
  push:
    description: "Push container after build"
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Normalize branch name
      id: vars
      shell: bash
      run: echo "TAG_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

    - name: Lint
      uses: docker/build-push-action@v5
      with:
        target: lint
        push: ${{ inputs.push }}
        file: ./app/Dockerfile
        cache-from: ${{ inputs.ecr-repo }}:${{ env.TAG_NAME }}
        context: .
