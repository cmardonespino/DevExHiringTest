name: "Unit tests"
description: "Unit tests for app"
inputs:
  aws-region:
    description: "AWS Region where the ECR is located"
    required: true
  aws-access-key-id:
    description: "Access key for interact with AWS"
    required: true
  aws-secret-access-key:
    description: "Access secret for interact with AWS"
    required: true


runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
        mask-aws-account-id: 'false'

    - name: Login to AWS ECR
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registries: ${{ inputs.aws-account-id }}

