name: "Container Build & Push"
description: "Builds a container image from the current repo"
inputs:
  aws-region:
    description: "AWS Region where the ECR is located"
    required: true
  context:
    description: "Build context where the container will be built"
    required: false
    default: "."
  target:
    description: "The target stage to build"
    required: false
  ecr-repo:
    description: "ECR repo where the container will be pushed"
    required: true
  aws-account-id:
    description: "AWS Account ID"
    required: true
  image-tag:
    description: "Tag that will be applied to the built container image"
    required: true
    default: build-${{ github.sha }}
  dockerfile:
    description: "Dockerfile used to build container"
    required: true
    default: "Dockerfile"
  push:
    description: "Push container after build"
    default: "true"

outputs:
  built-container:
    description: "Full refrence to the built container in ECR"
    value: ${{ inputs.ecr-repo }}:${{ inputs.image-tag }}
  cache-image:
    description: "Full refrence to the image cache in ECR"
    value: ${{ inputs.ecr-repo }}:${{ inputs.image-tag }}
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Normalize branch name
      id: vars
      shell: bash
      run: echo "TAG_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

    # DOCKER_BUILDKIT=1 docker buildx build --progress=plain --tag test -f ./app/Dockerfile .
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        target: build
        push: ${{ inputs.push }}
        file: ./app/Dockerfile
        tags: |
          ${{ inputs.ecr-repo }}:${{ inputs.image-tag }},${{ inputs.ecr-repo }}:${{ env.TAG_NAME }}
        cache-from: ${{ inputs.ecr-repo }}:${{ env.TAG_NAME }}
        context: .
